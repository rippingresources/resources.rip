        <script>
        let hasClickedEver = false
        let playing = false
        var player;

        const sleep = (milliseconds) => {
            return new Promise(resolve => setTimeout(resolve, milliseconds));
        };

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                height: '1',
                width: '1',
                videoId: 'aSc7Yuwn1Ao',
                playerVars: {
                    'playsinline': 1,
                    'controls': 0,
                    'loop': 1,
                    'disablekb': 1,
                    'playlist': 'aSc7Yuwn1Ao'
                },
                events: {
                    'onReady': onPlayerReady,
                }
            });
        }

        //A bit messy
        async function onPlayerReady(event) {
            $(document).ready(function(){
                $("html").click(async function(){
                    if (!hasClickedEver) {
                        hasClickedEver = true;
                        playing = !playing;
                        event.target.setVolume(0);
                        event.target.playVideo();
                        updateTitle();
                        for (let i = 0; i <= 100; i++) {
                            event.target.setVolume(i);
                            await sleep(2000);
                        }
                    }
                });
            });
        }

        async function updateTitle() {
            let textToAppend = '-where-it-rained'
            for (let i = 0; i <= textToAppend.length; i++) {
                $("title").text(`Discord | #the-place${textToAppend.substring(0, i)} | Ripping Resources`);
                await sleep(300);
            }
        }
        </script>

    <body>
